name: build

on:
  push:
    branches:
      - master
    tags:
      - "*-[0-9]+.*"
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'zulu'
          cache: 'maven'
      # TEMPORARY: janelia-jhdf5 26.10.0-SNAPSHOT is not published anywhere, so build and
      # install it into ~/.m2 first. Remove once janelia-jhdf5 is released.
      - name: Check out janelia-jhdf5
        uses: actions/checkout@v4
        with:
          repository: JaneliaSciComp/janelia-jhdf5
          ref: main
          path: janelia-jhdf5
      - name: Install janelia-jhdf5 snapshot
        working-directory: janelia-jhdf5
        run: mvn -B -U install -DskipTests -Djacoco.skip=true -Djavacpp.platform=linux-x86_64
        shell: bash
      - name: Set up CI environment
        run: .github/setup.sh
        shell: bash
      - name: Execute the build
        run: .github/build.sh
        shell: bash
        env:
          # TEMPORARY (remove once janelia-jhdf5 is released): pom-scijava's enforcer rejects SNAPSHOT dependencies.
          MAVEN_ARGS: -Denforcer.skip=true
          GPG_KEY_NAME: ${{ secrets.GPG_KEY_NAME }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASS: ${{ secrets.MAVEN_PASS }}
          CENTRAL_USER: ${{ secrets.CENTRAL_USER }}
          CENTRAL_PASS: ${{ secrets.CENTRAL_PASS }}
          SIGNING_ASC: ${{ secrets.SIGNING_ASC }}
